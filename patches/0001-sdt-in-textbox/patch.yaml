base:
  image: "docker.io/collabora/code"
  digest: "sha256:808410e77b8695a35b93c7638fbba07c10cf0ba8307141b460248f18ab6e5c55"
  version: "26.04.5.2"

custom:
  image: "ooxml-lab/collabora:0001-sdt-in-textbox"
  digest: "REPLACE_AFTER_BUILD"

reproducer: "bz31914-sdt-textbox"
expected:
  before: "T0 — 8 tokens absent, page count 1 vs 2"
  after: "PASS or SEGMENT — all characters present"

files:
  - "oox/source/vml/vmltextboxcontext.cxx"

revert: "git apply -R fix.patch, rebuild, retag clean"

notes: >
  VML textbox text is parsed by oox, not by writerfilter:
  TextBoxContext::onCreateContext() accepts only w:p as a child of
  w:txbxContent, so an w:sdt returns nullptr and the whole subtree is never
  parsed. The text never reaches the domain mapper, which is why every guard on
  the dmapper side (IsInShape, control type, data binding) had no effect.

  The existing sdt/sdtContent cases in the same function already handle the
  inside of the control; the fix only lets the wrapper in.
