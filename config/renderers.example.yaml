# Copy to private/config/renderers.yaml and pin every digest.
# A floating tag destroys comparability between runs.

renderers:
  - name: collabora-online
    role: render
    image: "collabora/code"
    digest: "sha256:REPLACE"
    adapter: collabora
    # This is the engine Nextcloud ships by default, so it is the correct
    # reference when the deployment target is Nextcloud + Collabora.
    #
    # The image is Nix-built and has NO shell, so the `soffice` wrapper script
    # cannot run. Call the real binary directly.
    entrypoint: "/opt/collaboraoffice/program/soffice.bin"
    command: >
      --headless --norestore --convert-to pdf --outdir /out /in/document.docx
    run_args: ["--user", "0", "-e", "HOME=/tmp"]
    # Verified producer string: "Collabora Office 26.04.5.2 (X86_64)"
    #
    # Bundled fonts: Carlito, Caladea, Liberation, DejaVu, Noto subset.
    # Missing: Georgia, Calibri, Cambria, Gelasio. Georgia is substituted with
    # NotoSerif (generic fallback, not metric-compatible) — this is the exact
    # failure that broke the Danish pilot's templates. Fix by adding Gelasio to
    # the image or removing Georgia from templates.

  - name: onlyoffice
    role: render
    image: "onlyoffice/documentserver"
    digest: "sha256:REPLACE"
    adapter: onlyoffice
    # heavier: all-in-one image bundles postgres, rabbitmq, redis

  - name: x2t
    role: convert_only
    image: "REPLACE"
    digest: "sha256:REPLACE"
    adapter: x2t
    # OOXML <-> ODF <-> bin without rendering; isolates conversion loss
    # from layout loss

fonts:
  # Metric-compatible clones belong HERE, not on the oracle.
  # Installing the real Calibri/Georgia on a renderer means testing a
  # machine nobody actually has.
  metric_compatible:
    - { substitute: Carlito,  for: Calibri }
    - { substitute: Caladea,  for: Cambria }
    - { substitute: Gelasio,  for: Georgia }
    - { substitute: Liberation, for: "Arial / Times New Roman" }
